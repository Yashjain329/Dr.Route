<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="50%" stop-color="#133c6d"/>
      <stop offset="100%" stop-color="#07162c"/>
    </linearGradient>

    <!-- Route Gradient (Electric Cyan to Emerald) -->
    <linearGradient id="routeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Medical Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Shield / Badge Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base App Icon Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#subtleShadow)"/>

  <!-- Subtle Outer Border Accent -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- Subtle Background Concentric GPS Radar Rings -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="rgba(0, 242, 254, 0.07)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="256" cy="220" r="95" fill="none" stroke="rgba(0, 242, 254, 0.1)" stroke-width="2"/>

  <!-- Glowing Route Waypoint Loop (Symbolizing 'Route') -->
  <path d="M160,280 C130,220 170,120 256,120 C342,120 382,220 352,280 C322,340 256,380 256,380 C256,380 190,340 160,280 Z" 
        fill="none" 
        stroke="url(#routeCyan)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.95"
        filter="url(#glow)"/>

  <!-- Medical Cross Geometry in Center Pin -->
  <!-- Vertical Cross Bar -->
  <rect x="240" y="172" width="32" height="96" rx="16" fill="#FFFFFF" filter="url(#subtleShadow)"/>
  <!-- Horizontal Cross Bar -->
  <rect x="208" y="204" width="96" height="32" rx="16" fill="#FFFFFF" filter="url(#subtleShadow)"/>

  <!-- Heartbeat ECG Pulse Wave crossing through the Route Center -->
  <path d="M110,220 L185,220 L205,175 L225,260 L245,190 L265,245 L285,175 L305,220 L402,220" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Beacon Origin Center Dot -->
  <circle cx="256" cy="220" r="8" fill="#00F2FE"/>

  <!-- GPS Route Destination Pinpoint at Base -->
  <circle cx="256" cy="380" r="10" fill="#10B981" filter="url(#glow)"/>
  <circle cx="256" cy="380" r="4" fill="#FFFFFF"/>

  <!-- Brand Typography: Dr.Route -->
  <g transform="translate(256, 442)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="1.5">
      <tspan fill="#FFFFFF">Dr.</tspan><tspan fill="#00F2FE">Route</tspan>
    </text>
  </g>
</svg>
