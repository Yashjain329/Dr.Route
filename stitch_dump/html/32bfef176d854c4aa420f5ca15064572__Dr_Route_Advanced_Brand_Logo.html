<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </linearGradient>
    <linearGradient id="primaryPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Route Grid Pattern / Radar Rings -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>
  <circle cx="256" cy="230" r="110" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Route Path Vector Loop -->
  <path d="M 140,290 C 140,160 210,110 256,110 C 302,110 372,160 372,290 C 372,360 290,410 256,410 C 222,410 140,360 140,290 Z" 
        fill="none" stroke="url(#primaryPulse)" stroke-width="6" opacity="0.25"/>

  <!-- Integrated Modern Pin & Cross Shield Base -->
  <g transform="translate(0, -10)">
    <!-- Location Pin Backdrop Glow -->
    <path d="M 256,90 C 180,90 125,145 125,225 C 125,320 235,400 256,415 C 277,400 387,320 387,225 C 387,145 332,90 256,90 Z" 
          fill="#132f58" stroke="url(#primaryPulse)" stroke-width="4" filter="url(#glow)"/>

    <!-- High-Precision Medical Cross -->
    <path d="M 232,150 L 280,150 A 6,6 0 0,1 286,156 L 286,196 A 6,6 0 0,0 292,202 L 332,202 A 6,6 0 0,1 338,208 L 338,256 A 6,6 0 0,1 332,262 L 292,262 A 6,6 0 0,0 286,268 L 286,308 A 6,6 0 0,1 280,314 L 232,314 A 6,6 0 0,1 226,308 L 226,268 A 6,6 0 0,0 220,262 L 180,262 A 6,6 0 0,1 174,256 L 174,208 A 6,6 0 0,1 180,202 L 220,202 A 6,6 0 0,0 226,196 L 226,156 A 6,6 0 0,1 232,150 Z" 
          fill="url(#crossGrad)"/>

    <!-- ECG Dynamic Pulse Line cutting across -->
    <path d="M 150,232 L 205,232 L 222,232 L 236,185 L 254,285 L 272,210 L 285,248 L 296,232 L 362,232" 
          fill="none" stroke="url(#pinGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Glowing GPS Route Dot / Spark -->
    <circle cx="256" cy="390" r="10" fill="#00f2fe" filter="url(#glow)"/>
    <circle cx="256" cy="390" r="5" fill="#ffffff"/>
  </g>

  <!-- Typography Brand Element -->
  <text x="256" y="470" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff">
    DR.<tspan fill="#00f2fe">ROUTE</tspan>
  </text>
</svg>
